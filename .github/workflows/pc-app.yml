name: PC App Build & Release

on:
  push:
    branches: [ main ]
    paths:
      - 'pc-app/**'
      - '.github/workflows/pc-app.yml'
    tags:
      - 'pc-v*'
  pull_request:
    branches: [ main ]
    paths:
      - 'pc-app/**'
      - '.github/workflows/pc-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Test, Audit & Build Windows Portable EXE
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        working-directory: pc-app
        run: npm install

      - name: Security audit (high+)
        working-directory: pc-app
        run: npm audit --audit-level=high

      - name: Run protocol & formatter unit tests
        working-directory: pc-app
        run: npm test

      - name: Build Windows portable executable
        working-directory: pc-app
        run: npm run build:win

      - name: Generate SHA-256 checksum
        working-directory: pc-app/dist
        shell: pwsh
        run: |
          Get-ChildItem *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: opendws-200-studio-win-x64
          path: |
            pc-app/dist/*.exe
            pc-app/dist/*.sha256
          retention-days: 14

      - name: Publish GitHub Release (pc-v* Tags only)
        if: startsWith(github.ref, 'refs/tags/pc-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pc-app/dist/*.exe
            pc-app/dist/*.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
