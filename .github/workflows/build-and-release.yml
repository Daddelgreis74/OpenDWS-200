name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-firmware:
    name: Test, Build Firmware & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install ARM/LLVM toolchain & Pillow
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm python3-pil

      - name: Run host unit tests (ASan + UBSan)
        run: make test

      - name: Build AT32F415 firmware binary
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            make firmware VERSION="${{ github.ref_name }}"
            make verify-bin VERSION="${{ github.ref_name }}"
          else
            make firmware
            make verify-bin
          fi

      - name: Generate UI preview screenshots
        run: make screenshots

      - name: Upload firmware & screenshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opendws-200-firmware
          path: |
            dist/*.bin
            docs/screenshots/*.png
          retention-days: 14

  build-pc-app:
    name: Test, Audit & Build PC Studio (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        working-directory: pc-app
        run: npm install

      - name: Security audit (high+)
        working-directory: pc-app
        run: npm audit --audit-level=high

      - name: Run protocol & formatter unit tests
        working-directory: pc-app
        run: npm test

      - name: Build Windows installer & portable executables
        working-directory: pc-app
        run: npm run build:win

      - name: Upload Windows EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opendws-200-studio-win-x64
          path: |
            pc-app/dist/*.exe
          retention-days: 14

  release:
    name: Publish Combined GitHub Release
    runs-on: ubuntu-latest
    needs: [ build-firmware, build-pc-app ]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: opendws-200-firmware
          path: artifacts/firmware

      - name: Download PC Studio artifacts
        uses: actions/download-artifact@v4
        with:
          name: opendws-200-studio-win-x64
          path: artifacts/pc-app

      - name: Collect combined release files
        run: |
          mkdir -p release-files
          find artifacts/firmware -type f -name '*.bin' -exec cp -v {} release-files/ \;
          find artifacts/pc-app -type f -name '*.exe' -exec cp -v {} release-files/ \;
          ls -lh release-files

      - name: Publish Combined GitHub Release (Firmware + PC Studio)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
