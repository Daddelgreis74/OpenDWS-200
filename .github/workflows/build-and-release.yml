name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test, Build Firmware & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install ARM/LLVM toolchain & Pillow
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm python3-pil

      - name: Run host unit tests (ASan + UBSan)
        run: make test

      - name: Build AT32F415 firmware binary
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            make firmware VERSION="${{ github.ref_name }}"
            make verify-bin VERSION="${{ github.ref_name }}"
          else
            make firmware
            make verify-bin
          fi

      - name: Generate UI preview screenshots
        run: make screenshots

      - name: Upload firmware & screenshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opendws-200-artifacts
          path: |
            dist/*.bin
            dist/*.sha256
            docs/screenshots/*.png
          retention-days: 14

      - name: Publish GitHub Release (Tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.bin
            dist/*.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
